# Meteor #

Meteor:
  Type: ARMOR_STAND
  Pose:
      Head: 0,0,0
  ItemHead: meteor
  Options:
    Marker: true
    Small: false
    Invisible: true
    Invincible: true
  Skills:
  - equip{item=meteor:4} ~onSpawn
  - effect:particles{particle=lava;amount=6;hS=0.25;vS=0.25;y=1;speed=0;forwardOffset=0;sideOffset=0} @self ~onTimer:1
