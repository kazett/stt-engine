name: stt
version: 3.0.0
main: id.stt.Stt
api-version: '1.20'
depend: [voicechat]
softdepend: [ItemsAdder, ModelEngine, MythicMobs, MythicLib]
commands:
  stt:
    description: STT menu, admin skill management, reload
    permission: stt.use
    usage: /stt [menu|reload|addskill|removeskill|mana]
permissions:
  stt.use:
    description: Open STT menu and use voice skills
    default: true
  stt.admin:
    description: Admin commands (addskill, removeskill, reload)
    default: op
